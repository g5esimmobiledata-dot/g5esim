name: esimconnect
description: "A new Flutter project."
publish_to: "none"
version: 1.0.10+10

environment:
  sdk: ^3.8.1

dependencies:
  cached_network_image: ^3.4.1
  carousel_slider: ^5.1.1
  clipboard: ^3.0.14
  cloud_firestore: ^6.1.0
  connectivity_plus: ^7.0.0
  country_picker: ^2.0.27
  cupertino_icons: ^1.0.8
  device_info_plus: ^12.3.0
  dio: ^5.8.0+1
  easy_localization: ^3.0.8
  equatable: ^2.0.7
  firebase_auth: ^6.0.2
  firebase_core: ^4.0.0
  firebase_messaging: ^16.0.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_html: ^3.0.0
  flutter_inappwebview: ^6.1.5
  flutter_local_notifications: ^21.0.0-dev.2
  font_awesome_flutter: ^10.12.0
  geolocator: ^14.0.2
  get: ^4.6.6
  google_sign_in: ^7.2.0
  image_picker: ^1.1.2
  in_app_purchase: ^3.2.3
  in_app_purchase_android: ^0.4.0+4
  in_app_purchase_storekit: ^0.4.4
  intl: ^0.20.2
  intl_phone_field: ^3.2.0
  lottie: ^3.3.1
  package_info_plus: ^9.0.0
  path_provider: ^2.1.5
  percent_indicator: ^4.2.5
  persistent_bottom_nav_bar_v2:
    path: packages/persistent_bottom_nav_bar_v2
  pin_input_text_field: ^4.5.2
  provider: ^6.1.5+1
  qr_flutter: ^4.1.0
  share_plus: ^12.0.1
  shared_preferences: ^2.3.1
  sizer: ^3.0.5
  skeletonizer: ^2.1.0+1
  socket_io_client: ^3.1.3
  timezone: ^0.11.0
  toastification: ^3.0.3
  url_launcher: ^6.3.2
  web: ^1.1.1
  country_flags: ^4.1.1
  http: ^1.6.0
  crypto: ^3.0.7
  uuid: ^4.5.2
  flutter_paypal: ^0.2.1
  mobile_scanner: ^7.2.0

dev_dependencies:
  bloc_test: ^10.0.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/
    - assets/images/
    - assets/translations/
    - assets/images/countryflags/
    - assets/lottie/

  fonts:
    - family: Lexend
      fonts:
        - asset: assets/fonts/Lexend-Black.ttf
        - asset: assets/fonts/Lexend-Bold.ttf
        - asset: assets/fonts/Lexend-Medium.ttf
        - asset: assets/fonts/Lexend-Regular.ttf
        - asset: assets/fonts/Lexend-SemiBold.ttf
        - asset: assets/fonts/Lexend-Thin.ttf
        - asset: assets/fonts/Lexend-ExtraBold.ttf
        - asset: assets/fonts/Lexend-ExtraLight.ttf
        - asset: assets/fonts/Lexend-Light.ttf
