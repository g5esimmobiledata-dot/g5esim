<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="G5 eSIM Apple App Store link.">
  <meta name="theme-color" content="#050816">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="/favicon.png">
  <title>G5 eSIM on the App Store</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #050816;
      --panel: #10192b;
      --text: #f7f9ff;
      --muted: #aab6cf;
      --line: #283554;
      --accent: #c8ff5f;
      --accent-ink: #102000;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0;
    }

    main {
      width: min(620px, calc(100% - 32px));
      padding: 26px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      text-align: center;
    }

    img {
      width: 70px;
      height: 70px;
      border-radius: 16px;
      margin-bottom: 16px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 32px;
      line-height: 1.1;
      letter-spacing: 0;
    }

    p {
      margin: 0 0 20px;
      color: var(--muted);
      line-height: 1.5;
    }

    a {
      display: inline-flex;
      min-height: 46px;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      padding: 0 16px;
      color: var(--accent-ink);
      background: var(--accent);
      font-weight: 800;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <img src="/apple-touch-icon.png" alt="G5 eSIM">
    <h1>App Store link coming soon</h1>
    <p>
      This QR code is reserved for the Apple App Store listing. After the app is
      approved, update this page to redirect to the real App Store URL.
    </p>
    <a href="/download.html">Back to install options</a>
  </main>
</body>
</html>
