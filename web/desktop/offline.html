<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>G5 eSIM Admin Offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0f172a;
        color: #f8fafc;
        font-family: Inter, "Segoe UI", Arial, sans-serif;
      }

      .panel {
        width: min(720px, calc(100vw - 48px));
        border: 1px solid rgba(148, 163, 184, 0.25);
        border-radius: 24px;
        background: rgba(15, 23, 42, 0.9);
        box-shadow: 0 32px 120px rgba(0, 0, 0, 0.32);
        padding: 36px;
      }

      h1 {
        margin: 0;
        font-size: 34px;
      }

      p {
        color: #cbd5e1;
        font-size: 18px;
        line-height: 1.6;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
        margin-top: 28px;
      }

      button {
        border: 1px solid #60a5fa;
        border-radius: 999px;
        background: transparent;
        color: #f8fafc;
        padding: 12px 20px;
        font-size: 16px;
        cursor: pointer;
      }

      button.primary {
        background: #2563eb;
        border-color: #2563eb;
      }
    </style>
  </head>
  <body>
    <main class="panel">
      <h1>Admin backend is not reachable</h1>
      <p>
        The desktop shell is running, but the live G5 eSIM admin backend could not be loaded.
        Full admin functionality requires a connection to the server because orders, eSIM providers,
        SIP, SMS, wallets, payments, and reports are not stored locally in this desktop app.
      </p>
      <div class="actions">
        <button class="primary" type="button" onclick="window.g5Desktop.openAdmin()">Try again</button>
        <button type="button" onclick="window.g5Desktop.openPrivacy()">Back to privacy</button>
        <button type="button" onclick="window.g5Desktop.closeApp()">Close</button>
      </div>
    </main>
  </body>
</html>
