# Include inside the existing Nginx server block for the web application.
# Public-asset compression fix deployed on September 17, 2026.
# Adjust the upstream port if the application does not run on port 5000.
location /assets/ {
    proxy_pass http://127.0.0.1:5000;
    proxy_set_header Host $host;
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types application/javascript text/javascript text/css application/json image/svg+xml;
}
